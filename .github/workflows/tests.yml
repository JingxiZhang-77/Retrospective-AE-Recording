name: Tests and example checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and optional format dependencies
        run: python -m pip install -e ".[all]"
      - name: Run regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Run public-reference synthetic walkthrough
        run: python -B scripts/run_public_reference_simulation.py
      - name: Check public repository content
        run: python -B scripts/check_repository.py

